name: Build Live Bridge

# Windows'ta tek dosya .exe üretir (bridge/). Linux Pages deploy'una dokunmaz.
on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/**"
      - ".github/workflows/bridge.yml"

permissions:
  contents: write        # Release'e .exe yüklemek için

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Çekirdek bağımlılıklar (mock her zaman çalışır)
        run: pip install requests pyinstaller

      - name: rF2 okuyucu (gerçek mod — best-effort)
        continue-on-error: true
        run: pip install -r requirements.txt

      - name: .exe derle
        run: pyinstaller --onefile --name CaspianLiveBridge --hidden-import pyRfactor2SharedMemory.sharedMemoryAPI main.py

      - name: Örnek config'i ekle
        run: copy config.example.ini dist\config.example.ini

      - uses: actions/upload-artifact@v4
        with:
          name: CaspianLiveBridge
          path: |
            bridge/dist/CaspianLiveBridge.exe
            bridge/dist/config.example.ini

      # Kalıcı, herkese açık indirme linki: releases/download/bridge-latest/CaspianLiveBridge.exe
      # (yalnız main'e push'ta; PR/dispatch'te yalnız artefakt kalır)
      - name: Release'e yükle (bridge-latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bridge-latest
          name: Caspian Live Bridge (son sürüm)
          body: "Otomatik derleme. Web 'Canlı' sekmesindeki İndir butonu buna bağlanır."
          files: |
            bridge/dist/CaspianLiveBridge.exe
            bridge/dist/config.example.ini
