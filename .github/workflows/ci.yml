name: CI

# Pull request'lerde ve main dışı push'larda lint + testleri çalıştırır.
# main'e push GitHub Pages deploy'unu (deploy.yml) tetikler; orada da test koşar.

on:
  pull_request:
  push:
    branches-ignore: [ main ]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # köprü (Python): tur-log sözleşmesi (lapNums kayması, araç kimliği) + VE ayrıştırma
      - run: python3 bridge/test_aggregator.py
      - run: python3 bridge/test_lmu_api.py

  rules-test:
    # Firebase RTDB güvenlik kuralları emülatörde test edilir (firebase-rules.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run test:rules
