name: Build Desktop App

# Windows'ta masaüstü (Tauri) paketi üretir: dist/ (Vite build) gömülü olarak
# paketlenir, imzalanır, GitHub Release'e yüklenir. Uygulama içi updater
# (UpdateBanner) bu release'in latest.json'ını okuyup güncelleme sunar.
#
# ÖNEMLİ: Her yeni sürüm için package.json + src-tauri/tauri.conf.json'daki
# "version" bir öncekinden FARKLI olmalı — aksi halde tauri-action aynı tag'i
# tekrar oluşturmaya çalışıp başarısız olabilir.
#
# İmzalama anahtarı olmadan (TAURI_SIGNING_PRIVATE_KEY secret'ı eklenmeden)
# bu iş akışı başarısız olur — bu beklenen bir durumdur, ilk kurulumda tek
# seferlik bir adımdır (bkz. src-tauri/tauri.conf.json'daki pubkey notu).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Node bağımlılıkları
        run: npm ci

      # Canlı köprüyü (Python) sidecar .exe olarak derle → uygulama içinden
      # çalıştırılır (--emit modu). Hedef üçlüsü ekli ad Tauri externalBin ile
      # eşleşmeli: binaries/caspian-bridge-x86_64-pc-windows-msvc.exe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Köprü sidecar bağımlılıkları
        run: pip install requests pyinstaller

      - name: rF2 okuyucu (gerçek mod — best-effort)
        continue-on-error: true
        run: pip install -r bridge/requirements.txt

      - name: Köprü sidecar .exe derle
        shell: pwsh
        run: |
          pyinstaller --onefile --name caspian-bridge `
            --hidden-import pyRfactor2SharedMemory.sharedMemoryAPI `
            --distpath bridge/dist bridge/main.py
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item bridge/dist/caspian-bridge.exe `
            src-tauri/binaries/caspian-bridge-x86_64-pc-windows-msvc.exe

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Masaüstü Google girişi (sistem tarayıcısı + loopback OAuth).
          # VITE_… ön yüz derlemesine gömülür (client_id gizli değildir);
          # GOOGLE_OAUTH_CLIENT_SECRET yalnız Rust'ta derleme zamanı okunur.
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "Caspian Race Monitor v__VERSION__"
          releaseBody: "Otomatik derleme — uygulama içi güncelleyici bunu kullanır."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
