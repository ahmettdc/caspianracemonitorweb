[package]
name = "caspian-race-monitor"
version = "1.7.7"
description = "Caspian Race Monitor — LMU pit-wall stratejı arayüzü (masaüstü kabuğu)"
authors = ["Caspian Motorsport"]
license = ""
repository = "https://github.com/ahmettdc/caspianracemonitorweb"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-oauth = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Yalnız Windows: BELOW_NORMAL öncelik (SetPriorityClass) + CPU affinity Job Object'i
# (CreateJobObject/SetInformationJobObject + GetSystemInfo) + WebView2 çocuklarını süreç
# ağacında tarayıp affinity'yi sabitleyen watchdog (ToolHelp) — bkz. lib.rs run().
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",          # CreateJobObjectW imzasındaki SECURITY_ATTRIBUTES için
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",   # CreateToolhelp32Snapshot / Process32FirstW/NextW
] }
